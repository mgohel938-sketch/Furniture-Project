<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - FurniShop Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

    <!-- Admin Sidebar -->
    <aside id="admin-sidebar" class="admin-sidebar"></aside>

    <div class="admin-main">
        <!-- Admin Topbar -->
        <header id="admin-topbar" class="admin-topbar"></header>

        <div class="admin-content">
            <!-- 8 Live Metrics Stat Grid -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-info">
                        <h3>Total Products</h3>
                        <div class="stat-number" id="stat-products">0</div>
                    </div>
                    <div class="stat-icon"><i class="fa-solid fa-couch"></i></div>
                </div>

                <div class="stat-card">
                    <div class="stat-info">
                        <h3>Total Customers</h3>
                        <div class="stat-number" id="stat-customers">0</div>
                    </div>
                    <div class="stat-icon success"><i class="fa-solid fa-users"></i></div>
                </div>

                <div class="stat-card">
                    <div class="stat-info">
                        <h3>Total Orders</h3>
                        <div class="stat-number" id="stat-orders">0</div>
                    </div>
                    <div class="stat-icon"><i class="fa-solid fa-receipt"></i></div>
                </div>

                <div class="stat-card">
                    <div class="stat-info">
                        <h3>Total Sales Revenue</h3>
                        <div class="stat-number" id="stat-sales" style="font-size: 1.5rem;">$0</div>
                    </div>
                    <div class="stat-icon success"><i class="fa-solid fa-dollar-sign"></i></div>
                </div>

                <div class="stat-card">
                    <div class="stat-info">
                        <h3>Pending Orders</h3>
                        <div class="stat-number" id="stat-pending">0</div>
                    </div>
                    <div class="stat-icon warning"><i class="fa-solid fa-clock"></i></div>
                </div>

                <div class="stat-card">
                    <div class="stat-info">
                        <h3>Delivered Orders</h3>
                        <div class="stat-number" id="stat-delivered">0</div>
                    </div>
                    <div class="stat-icon success"><i class="fa-solid fa-circle-check"></i></div>
                </div>

                <div class="stat-card">
                    <div class="stat-info">
                        <h3>Low Stock Alert</h3>
                        <div class="stat-number" id="stat-lowstock">0</div>
                    </div>
                    <div class="stat-icon warning"><i class="fa-solid fa-triangle-exclamation"></i></div>
                </div>

                <div class="stat-card">
                    <div class="stat-info">
                        <h3>Out of Stock</h3>
                        <div class="stat-number" id="stat-outstock">0</div>
                    </div>
                    <div class="stat-icon danger"><i class="fa-solid fa-ban"></i></div>
                </div>
            </div>

            <!-- Recent Orders & Inventory Overview -->
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
                
                <!-- Recent Orders Table -->
                <div class="admin-card">
                    <div class="admin-card-header">
                        <h2>Recent Customer Orders</h2>
                        <a href="admin-orders.html" class="btn btn-outline btn-sm">View All Orders</a>
                    </div>
                    <div class="admin-card-body" style="padding:0;">
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Order ID</th>
                                        <th>Customer</th>
                                        <th>Total</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="recent-orders-body">
                                    <!-- Loaded dynamically -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Stock Alert Box -->
                <div class="admin-card">
                    <div class="admin-card-header">
                        <h2>Critical Stock Items</h2>
                        <a href="admin-inventory.html" class="btn btn-outline btn-sm">Inventory</a>
                    </div>
                    <div class="admin-card-body">
                        <div id="stock-alerts-list" style="display: flex; flex-direction: column; gap: 1rem;">
                            <!-- Loaded dynamically -->
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="js/db.js"></script>
    <script src="js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderDashboardData();
        });

        function renderDashboardData() {
            const products = db.getProducts();
            const customers = db.getUsers();
            const orders = db.getOrders();
            const sales = db.get(DB_KEYS.SALES);
            const settings = db.getSettings();

            // Calculate Metrics
            const totalProducts = products.length;
            const totalCustomers = customers.length;
            const totalOrders = orders.length;

            let totalRevenue = sales.reduce((sum, s) => sum + s.amount, 0);

            const pendingOrders = orders.filter(o => o.orderStatus === 'Pending').length;
            const deliveredOrders = orders.filter(o => o.orderStatus === 'Delivered').length;
            
            const lowStockCount = products.filter(p => p.stock > 0 && p.stock <= settings.lowStockLimit).length;
            const outStockCount = products.filter(p => p.stock <= 0).length;

            // DOM Binding
            document.getElementById('stat-products').textContent = totalProducts;
            document.getElementById('stat-customers').textContent = totalCustomers;
            document.getElementById('stat-orders').textContent = totalOrders;
            document.getElementById('stat-sales').textContent = `${settings.currency}${totalRevenue.toLocaleString(undefined, {maximumFractionDigits:0})}`;
            document.getElementById('stat-pending').textContent = pendingOrders;
            document.getElementById('stat-delivered').textContent = deliveredOrders;
            document.getElementById('stat-lowstock').textContent = lowStockCount;
            document.getElementById('stat-outstock').textContent = outStockCount;

            // Render Recent Orders
            const recentOrders = orders.slice(0, 5);
            const ordersBody = document.getElementById('recent-orders-body');
            if (ordersBody) {
                if (recentOrders.length === 0) {
                    ordersBody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No orders placed yet.</td></tr>`;
                } else {
                    ordersBody.innerHTML = recentOrders.map(o => `
                        <tr>
                            <td style="font-weight:700; color:var(--admin-accent);">${o.id}</td>
                            <td>${o.customerName}</td>
                            <td style="font-weight:700;">${settings.currency}${o.total}</td>
                            <td>${getStatusBadgeHtml(o.orderStatus)}</td>
                            <td>
                                <a href="admin-orders.html" class="btn-icon btn-icon-view" title="Manage Order"><i class="fa-solid fa-eye"></i></a>
                            </td>
                        </tr>
                    `).join('');
                }
            }

            // Render Stock Alert Items
            const alertProducts = products.filter(p => p.stock <= settings.lowStockLimit);
            const alertsList = document.getElementById('stock-alerts-list');
            if (alertsList) {
                if (alertProducts.length === 0) {
                    alertsList.innerHTML = `<p style="color:var(--admin-text-muted); font-size:0.9rem;">All inventory levels are healthy.</p>`;
                } else {
                    alertsList.innerHTML = alertProducts.map(p => `
                        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--admin-border); padding-bottom:0.75rem;">
                            <div>
                                <div style="font-weight:700; font-size:0.9rem;">${p.name}</div>
                                <div style="font-size:0.75rem; color:var(--admin-text-muted);">${p.category}</div>
                            </div>
                            <span class="status-badge ${p.stock <= 0 ? 'outstock' : 'lowstock'}">
                                ${p.stock <= 0 ? 'Out of Stock' : `${p.stock} Left`}
                            </span>
                        </div>
                    `).join('');
                }
            }
        }
    </script>
</body>
</html>
